<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Whiteboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1e1e1e; color: white; }
        canvas { background: #ffffff; cursor: crosshair; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Collaborative Real-Time Whiteboard</h2>
    <canvas id="whiteboard" width="800" height="500"></canvas>
    <script>
        const canvas = document.getElementById("whiteboard");
        const ctx = canvas.getContext("2d");
        const ws = new WebSocket("ws://127.0.0.1:8000/ws/canvas");

        let painting = false;

        canvas.addEventListener("mousedown", () => painting = true);
        canvas.addEventListener("mouseup", () => { painting = false; ctx.beginPath(); });
        canvas.addEventListener("mousemove", draw);

        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#000000";

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);

            // Send coordinates to WebSocket server
            ws.send(JSON.stringify({ x, y }));
        }

        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);
            // Draw remote client strokes on canvas here if desired
        };
    </script>
</body>
</html>
